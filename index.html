<html>
<head>
    <title>Budget Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Budget Tracker</h1>
        <div class="add-expense">
            <label for="expense-name">Expense Name:</label>
            <input type="text" id="expense-name" placeholder="What did you spent on?">
            <label for="expense-amount">Amount:</label>
            <input type="number" id="expense-amount" placeholder="How much?">
            <button onclick="addExpense()">Add Expense</button>
        </div>
        <h2>Expenses</h2>
        <ul id="expense-list">
        </ul>
        <h3>Total: ₹<span id="total-amount">0</span></h3>
        <div class="add-savings">
            <label for="savings-amount">Current Savings:</label>
            <input type="number" id="savings-amount" placeholder="How much do you have now?">
            <button onclick="updateSavings()">Update Savings</button>
        </div>
        <h3>Remaining Balance: ₹<span id="remaining-balance">0</span></h3>
    </div>

    <script src="script.js"></script>
</body>
</html>
